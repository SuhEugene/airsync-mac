name: Swift Build and Debug Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    # - name: Build Debug
    #   run: |
    #     xcodebuild -scheme airsync-mac -configuration Debug clean build | xcpretty

    - name: Build Self Compiled
      run: |
        xcodebuild -scheme "AirSync Self Compiled" -configuration "Self Compiled" clean build | xcpretty

    # - name: Archive Debug Build Artifacts
    #   if: success()
    #   run: |
    #     mkdir -p build-artifacts/Debug
    #     cp -R "$(xcodebuild -scheme airsync-mac -configuration Debug -showBuildSettings | grep -m 1 BUILD_DIR | awk '{print $3}')/Debug/"* build-artifacts/Debug/
    #   shell: bash

    - name: Archive Self Compiled Build Artifacts
      if: success()
      run: |
        mkdir -p build-artifacts/SelfCompiled
        cp -R "$(xcodebuild -scheme "AirSync Self Compiled" -configuration "Self Compiled" -showBuildSettings | grep -m 1 BUILD_DIR | awk '{print $3}')/Self Compiled/"* build-artifacts/SelfCompiled/
      shell: bash

    # - name: Upload Debug Build Artifacts
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: AirSync-Debug
    #     path: build-artifacts/Debug

    - name: Upload Self Compiled Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AirSync-SelfCompiled
        path: build-artifacts/SelfCompiled
